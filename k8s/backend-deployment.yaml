apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediqueue-backend
  labels:
    app: mediqueue-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mediqueue-backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mediqueue-backend
    spec:
      containers:
        - name: api
          image: mediqueue-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: Database_URI
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: Database_URI
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-credentials
                  key: SUPABASE_URL
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-credentials
                  key: SUPABASE_ANON_KEY
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resend-credentials
                  key: RESEND_API_KEY
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: resend-credentials
                  key: EMAIL_FROM
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: resend-credentials
                  key: APP_URL
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
