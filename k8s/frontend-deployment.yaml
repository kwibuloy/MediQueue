# Appendix: frontend Deployment (nginx serving Vite build)
#
# Apply: kubectl apply -f k8s/frontend-deployment.yaml
#
# Purpose: serves static SPA assets; nginx proxies /api to mediqueue-backend-svc.
# VITE_API_URL=/api keeps API calls same-origin via the NodePort Service.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediqueue-frontend
  labels:
    app: mediqueue-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mediqueue-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mediqueue-frontend
    spec:
      containers:
        - name: web
          image: mediqueue-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
